name: Load test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "loadtest/**"
      - "docker-compose.loadtest.yml"
      - ".github/workflows/load-test.yml"

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.loadtest.yml up -d --build
          for i in $(seq 60); do curl -sf localhost:8080/healthz && break; sleep 2; done
          curl -sf localhost:8080/healthz

      - name: Warm up
        run: |
          for i in $(seq 50); do
            curl -s -o /dev/null localhost:8080/v1/chat/completions -H "Authorization: Bearer gw-demo-key" \
              -H "Content-Type: application/json" -d '{"model":"mock-1","messages":[{"role":"user","content":"warm"}]}'
          done

      - name: Overhead test (300 req/s for 60s, in-process mock provider)
        run: |
          chmod 777 loadtest/results
          docker run --rm --network host -v "$PWD/loadtest:/scripts" grafana/k6:0.53.0 run --quiet /scripts/overhead.js

      - name: Chaos test (provider stopped at 20s, restarted at 40s)
        run: |
          docker run --rm --network host -v "$PWD/loadtest:/scripts" grafana/k6:0.53.0 run --quiet /scripts/chaos.js &
          K6=$!
          sleep 20 && docker compose -f docker-compose.yml -f docker-compose.loadtest.yml stop mock-upstream
          sleep 20 && docker compose -f docker-compose.yml -f docker-compose.loadtest.yml start mock-upstream
          wait $K6

      - name: Gateway view after the run
        if: always()
        run: |
          curl -s localhost:8080/admin/providers -H "X-Admin-Key: dev-admin-key"; echo
          curl -s localhost:8080/admin/teams/demo/usage -H "X-Admin-Key: dev-admin-key"; echo
          curl -s localhost:8080/metrics | grep -E "^gateway_(fallbacks|limit_rejections|requests)_total" | head -40
          docker compose -f docker-compose.yml -f docker-compose.loadtest.yml logs gateway --tail 50

      - name: Results to job summary
        if: always()
        run: |
          for f in loadtest/results/*.json; do
            echo "### $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat "$f" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-results
          path: loadtest/results/*.json
