services:
  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Username=gateway;Password=gateway;Database=gateway"
      ConnectionStrings__Redis: "redis:6379"
      Gateway__AdminKey: "${GATEWAY_ADMIN_KEY:-dev-admin-key}"
      Gateway__Providers__openai__ApiKey: "${OPENAI_API_KEY:-}"
      # Reach Ollama running on your machine (if you have it).
      Gateway__Providers__ollama__BaseUrl: "http://host.docker.internal:11434/v1"
      # Slow the mock down a little so streaming is visible.
      Gateway__Providers__mock__MockTokenDelayMs: "30"
      # Demo team + key so you can try it immediately. Remove for anything real.
      Gateway__Bootstrap__TeamId: "demo"
      Gateway__Bootstrap__TeamName: "Demo team"
      Gateway__Bootstrap__ApiKey: "gw-demo-key"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
